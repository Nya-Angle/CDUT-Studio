name: macOS Package & Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支、tag 或 commit SHA'
        required: false
        default: 'main'
      publish_release:
        description: '是否发布/挂载到 GitHub Release'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: macos-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-arm64:
    name: build (macos-14, darwin, arm64)
    runs-on: macos-14
    # Vite 处理包含 OOXML/WASM 资源的 renderer 时，Node 默认约 2 GiB 堆上限不足。
    env:
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # bun 在 darwin 宿主上解析出的依赖图与本机（Windows）生成的 bun.lock
        # 存在平台级物化差异，frozen 校验会直接失败。这里优先 frozen，
        # 失败时降级非冻结安装，并打印 lockfile 差异供后续收敛。
        run: |
          if ! bun install --frozen-lockfile; then
            echo "::warning::darwin 上 bun.lock 与解析结果不一致，降级为非冻结安装"
            bun install
            git --no-pager diff --stat -- bun.lock || true
            git --no-pager diff -- bun.lock | head -200 || true
          fi

      - name: Verify app version and changelog
        run: |
          package_version=$(node -p "require('./apps/electron/package.json').version")
          changelog_version=$(node -p "require('./apps/electron/resources/CHANGELOG.json').releases[0].version")
          test "$package_version" = "$changelog_version"
          echo "Verifying version: $package_version"

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Check package boundaries
        run: bun run check:boundaries

      - name: Run cross-platform packaging tests
        # 全量测试集合包含 Windows PowerShell 专用测试，以及仍按裸路径字符串比较
        # macOS /private/var 别名的测试；它们不应阻断 macOS 包构建。
        # 这里保留与安装包、CLI、Pi 闭包和核心会话/任务图直接相关的跨平台回归。
        run: >-
          bun test --isolate --max-concurrency=1 --timeout 30000
          apps/electron/scripts/package-closure.test.ts
          apps/electron/scripts/build-cli-runtime.test.ts
          apps/electron/scripts/ui-workspace-contract.test.ts
          packages/ui/src/markdown-preview.test.tsx
          packages/session-core/src/session-core.test.ts
          packages/project-core/src/project-core.test.ts

      - name: Build and package macOS arm64
        working-directory: apps/electron
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "worktree dirty: $(git status --porcelain | head -5)"
          echo '--- build-ooxml.mjs (first 18 lines) ---'
          sed -n '1,18p' scripts/build-ooxml.mjs
          echo '--- ooxml resolve ---'
          node -e "console.log(require.resolve('@silurus/ooxml'))"
          bun run dist:mac

      - name: Upload macOS installable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CDUT-Studio-macOS-arm64-${{ github.ref_name }}
          path: apps/electron/out/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish_release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [ -z "$tag" ]; then
            version=$(node -p "require('./apps/electron/package.json').version")
            tag="v$version"
          fi
          echo "Target tag: $tag"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag exists, uploading macOS assets..."
            gh release upload "$tag" \
              apps/electron/out/*.dmg \
              --repo "${{ github.repository }}" \
              --clobber
          else
            echo "Release $tag not found, creating release..."
            gh release create "$tag" \
              apps/electron/out/*.dmg \
              --repo "${{ github.repository }}" \
              --title "CDUT Studio $tag" \
              --generate-notes
          fi
