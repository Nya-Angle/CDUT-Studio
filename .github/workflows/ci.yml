name: PR CI

# PR 与 main 直推的统一快速验证门。
# 完整的 Windows 发布验证走 release.yml（手动 dispatch）；本 workflow 保证每次 PR 都有检查。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      # 测试通过 bunfig preload mock electron 模块，不需要真实二进制；跳过下载加速安装
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 与 release.yml 保持一致：固定到已在本地验证过的版本，避免 latest 改变 lockfile 或测试行为
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Check package boundaries
        run: bun run check:boundaries

      - name: Verify built-in skin surface contract
        run: bun --cwd apps/electron run check:skin-contract

      - name: Build main / preload / renderer
        run: |
          bun --cwd apps/electron run build:main
          bun --cwd apps/electron run build:preload
          bun --cwd apps/electron run build:renderer

      - name: Run unit and regression tests
        # --isolate: bun 的 mock.module('electron') 是进程级注册表，默认并行下多文件互相覆盖导致误报；
        # 隔离模式保证每个测试文件独立（与 release.yml 同款参数）
        run: bun test --isolate --timeout 30000
