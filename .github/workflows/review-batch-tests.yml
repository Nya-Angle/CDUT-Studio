name: Review batch focused tests

on:
  pull_request:
    paths:
      - 'packages/shared/src/review/batch-review-triage*'
      - 'apps/electron/src/main/lib/review/batch-store*'
      - 'apps/electron/src/main/lib/review/review-storage-id*'
      - 'apps/electron/src/main/lib/review/review-ipc-path.test.ts'
      - 'test/preload-electron-mock.ts'
      - 'apps/electron/src/main/lib/review/run-store-v2.ts'
      - 'apps/electron/src/main/lib/review/case-store-v2.ts'
      - 'apps/electron/src/main/lib/review/application-service.ts'
      - 'apps/electron/src/main/lib/review/batch-group-action-service*'
      - 'apps/electron/src/main/lib/review/batch-automation-*'
      - 'apps/electron/src/main/lib/review/workspace-business-service-v2.ts'
      - 'apps/electron/src/main/lib/review/review-ipc-actor-guard*'
      - 'apps/electron/src/main/lib/review/stage-workflow.ts'
      - 'apps/electron/src/main/lib/review/real-chain-journey.test.ts'
      - 'apps/electron/src/main/lib/review/review-ipc.ts'
      - 'apps/electron/src/renderer/components/content-review/BatchAutomationDialog.tsx'
      - 'apps/electron/src/renderer/components/content-review/BatchPanel.tsx'
      - 'apps/electron/src/renderer/components/content-review/batch-ui-feedback*'
      - '.github/workflows/review-batch-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-batch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-batch:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Batch triage and queue regression tests
        run: bun test --isolate --timeout 30000 packages/shared/src/review/batch-review-triage.test.ts apps/electron/src/main/lib/review/batch-store.test.ts apps/electron/src/main/lib/review/batch-group-action-service.test.ts apps/electron/src/main/lib/review/batch-automation-service.test.ts apps/electron/src/main/lib/review/stage-workflow.test.ts apps/electron/src/main/lib/review/workspace-business-service-v2.test.ts apps/electron/src/main/lib/review/case-store-v2.test.ts apps/electron/src/main/lib/review/template-store.test.ts apps/electron/src/main/lib/review/review-ipc-actor-guard.test.ts apps/electron/src/main/lib/review/real-chain-journey.test.ts apps/electron/src/main/lib/review/review-storage-id.test.ts apps/electron/src/renderer/components/content-review/batch-ui-feedback.test.ts apps/electron/src/main/lib/review/review-ipc-path.test.ts
