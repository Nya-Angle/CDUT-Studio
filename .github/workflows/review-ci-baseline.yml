name: Review Baseline CI
on:
  pull_request:
    paths:
      - 'apps/electron/src/main/lib/review/**'
      - 'apps/electron/src/main/lib/skin-manager-service.test.ts'
      - 'apps/electron/src/main/lib/agent-workspace-profile.test.ts'
      - 'apps/electron/scripts/packaging-guards.test.ts'
      - 'apps/electron/resources/CHANGELOG.json'
      - '.github/workflows/review-ci-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-baseline:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Typecheck workspace
        run: bun run typecheck
      - name: Check package boundaries
        run: bun run check:boundaries
      - name: Verify built-in skin contract
        working-directory: apps/electron
        run: bun run check:skin-contract
      - name: Build main, preload and renderer
        working-directory: apps/electron
        run: |
          bun run build:main
          bun run build:preload
          bun run build:renderer
      - name: Run all unit and regression tests
        run: bun test --isolate --timeout 30000
